spring.application.name=demo

spring.datasource.url=jdbc:mysql://localhost:3306/demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT Configuration
# Base64 encoded secret, replace in production
jwt.secret=d2VsbG5lc3MtbWFya2V0cGxhY2Utc2VjcmV0LWtlLWZvci1qd3QtYXV0aGVudGljYXRpb24tMjAyNi1zZWN1cmUta2V5
jwt.access-token.expiration=900000
jwt.refresh-token.expiration=604800000

# NPI Registry (Public API)
npi.api.base-url=https://npiregistry.cms.hhs.gov/api/

# WHO API (optional) — set this to a real endpoint if available.
# Example placeholder: https://ghoapi.azureedge.net/api/Indicator?$filter=contains(IndicatorName,'
who.api.base-url=

# OpenFDA API
openfda.api.base-url=https://api.fda.gov/drug/label.json?search=purpose:

# Gemini AI
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models
gemini.model=gemini-2.5-flash
gemini.api.key=YOUR_GOOGLE_API_KEY

# ── Email / Session Reminder ─────────────────────────────────────────────────
# Replace with your Gmail address and an App Password
# (Google Account → Security → 2-Step Verification → App passwords)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_GMAIL_ADDRESS
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# How many hours before a session should the reminder fire? (default: 24)
app.reminder.hours-before=24
# Cron: run the reminder check every hour  (sec min hr day month weekday)
app.reminder.cron=0 0 * * * *
# Send an email whenever an in-app notification is created
app.notifications.email.enabled=true
# Enable detailed error messages in responses
server.error.include-message=always
